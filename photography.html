<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Photographs by Yiliu Cao — a collection of places and moments."
    />
    <title>Gallery · Yiliu Cao</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header container">
      <div class="header-top">
        <a class="site-name" href="index.html">Yiliu Cao</a>
        <button
          class="theme-toggle"
          type="button"
          aria-label="Switch colour theme"
          data-theme-toggle
          hidden
        >
          <svg data-moon viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"
            />
          </svg>
          <svg data-sun viewBox="0 0 24 24" aria-hidden="true" hidden>
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
            />
          </svg>
        </button>
      </div>
      <nav aria-label="Main navigation">
        <ul class="site-nav">
          <li><a href="index.html">About</a></li>
          <li><a href="research.html">Research</a></li>
          <li><a href="publication.html">Publication</a></li>
          <li><a href="vitae.html">Vitae</a></li>
          <li><a href="photography.html" aria-current="page">Gallery</a></li>
          <li><a href="misc.html">Misc</a></li>
        </ul>
      </nav>
    </header>
    <main id="main" class="container">
      <div class="page-intro">
        <h1>Gallery</h1>
        <p>A collection of places and moments, seen through my lens.</p>
        <p>
          <a href="assets/images/photography/taxi-stand.jpg" data-gallery-open
            >Open gallery view</a
          >
        </p>
      </div>
      <div class="gallery">
        <!-- Duplicate a complete figure to add a photograph. See README.md. -->
        <!-- Source: DSC_0046.JPG. Location and month confirmed by the owner. -->
        <figure class="gallery-item">
          <a
            class="photo-link"
            href="assets/images/photography/taxi-stand.jpg"
            aria-label="Open photograph 1 in gallery view"
          >
            <img
              src="assets/images/photography/taxi-stand.jpg"
              alt="Red taxis lined up beneath illuminated shopfronts and a taxi-stand sign at night"
              width="5568"
              height="3712"
              decoding="async"
            />
          </a>
          <figcaption>
            <p class="photo-details">
              Hong Kong, <time datetime="2026-09">2026.9</time>
            </p>
          </figcaption>
        </figure>
        <!-- Source: DSC_0050.JPG. Location and month confirmed by the owner. -->
        <figure class="gallery-item">
          <a
            class="photo-link"
            href="assets/images/photography/night-traffic.jpg"
            aria-label="Open photograph 2 in gallery view"
          >
            <img
              src="assets/images/photography/night-traffic.jpg"
              alt="A red taxi passing illuminated buildings, followed by more taxis and a double-decker bus"
              width="5568"
              height="3712"
              decoding="async"
            />
          </a>
          <figcaption>
            <p class="photo-details">
              Hong Kong, <time datetime="2026-09">2026.9</time>
            </p>
          </figcaption>
        </figure>
        <!-- Source: DSC_0110.JPG. Location and month confirmed by the owner. -->
        <figure class="gallery-item">
          <a
            class="photo-link"
            href="assets/images/photography/after-hours.jpg"
            aria-label="Open photograph 3 in gallery view"
          >
            <img
              src="assets/images/photography/after-hours.jpg"
              alt="An illuminated pedestrian footbridge over a street, with a double-decker bus and a car below"
              width="5568"
              height="3712"
              loading="lazy"
              decoding="async"
            />
          </a>
          <figcaption>
            <p class="photo-details">
              Hong Kong, <time datetime="2026-09">2026.9</time>
            </p>
          </figcaption>
        </figure>
        <!-- Source: DSC_0123.JPG. Location and month confirmed by the owner. -->
        <figure class="gallery-item">
          <a
            class="photo-link"
            href="assets/images/photography/above-the-city.jpg"
            aria-label="Open photograph 4 in gallery view"
          >
            <img
              src="assets/images/photography/above-the-city.jpg"
              alt="A dense skyline of high-rise buildings beside a harbour beneath a cloudy sky"
              width="5568"
              height="3712"
              loading="lazy"
              decoding="async"
            />
          </a>
          <figcaption>
            <p class="photo-details">
              Hong Kong, <time datetime="2026-09">2026.9</time>
            </p>
          </figcaption>
        </figure>
        <!-- Source: DSC_0207.JPG. Location and month confirmed by the owner. -->
        <figure class="gallery-item">
          <a
            class="photo-link"
            href="assets/images/photography/cafe-corner.jpg"
            aria-label="Open photograph 5 in gallery view"
          >
            <img
              src="assets/images/photography/cafe-corner.jpg"
              alt="A tree-lined sidewalk outside Fable Café, with parked cars and shops along the street"
              width="5568"
              height="3712"
              loading="lazy"
              decoding="async"
            />
          </a>
          <figcaption>
            <p class="photo-details">
              Vancouver, BC, <time datetime="2026-09">2026.9</time>
            </p>
          </figcaption>
        </figure>
        <!-- Original landscape: month confirmed by the owner; add the location when known. -->
        <figure class="gallery-item">
          <a
            class="photo-link"
            href="assets/images/photography/winter-light.jpg"
            aria-label="Open photograph 6 in gallery view"
          >
            <img
              src="assets/images/photography/winter-light.jpg"
              alt="Snow-covered hills and forest beneath a blue-grey sky, with golden light along the horizon"
              width="4032"
              height="3024"
              loading="lazy"
              decoding="async"
            />
          </a>
          <figcaption>
            <p class="photo-details">
              Kelowna, BC, <time datetime="2026-09">2026.9</time>
            </p>
          </figcaption>
        </figure>
      </div>
    </main>
    <dialog
      class="photo-dialog"
      aria-label="Gallery viewer"
      aria-describedby="viewer-details"
    >
      <div class="dialog-toolbar">
        <p data-photo-count aria-live="polite" aria-atomic="true"></p>
        <button class="dialog-close" type="button" autofocus>
          Close <span aria-hidden="true">×</span>
        </button>
      </div>
      <img class="dialog-image" alt="" />
      <div class="dialog-caption" aria-live="polite">
        <div id="viewer-details"></div>
      </div>
      <div class="dialog-bottom" hidden>
        <button class="gallery-step" data-previous type="button">
          Previous
        </button>
        <button class="gallery-step" data-next type="button">Next</button>
      </div>
    </dialog>
    <script src="assets/js/gallery.js" defer></script>
    <footer class="site-footer container">
      <p>Yiliu Cao</p>
    </footer>
  </body>
</html>
